[project]
name = "math_eval_v8"
version = "0.1.0"
description = "Lean formal benchmark evaluation pipeline for miniF2F/PutnamBench-style tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "datasets>=2.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/math_eval_v8"]
