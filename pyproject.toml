[project]
name = "math_eval_v7"
version = "0.1.0"
description = "Math Evaluation Framework Optimized for Korean Open Source Models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "pandas>=2.0.0",
    "datasets>=2.14.0",
    "python-dotenv>=1.0.0",
    "termcolor>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/math_eval_v7"]
